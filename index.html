<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медиа Хаб & Транскрибация 24/7</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Ключи Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBOvBJl3ftoA-185RFuN3QFkpksEVqad5o",
            authDomain: "saitaaaa.firebaseapp.com",
            projectId: "saitaaaa",
            storageBucket: "saitaaaa.firebasestorage.app",
            messagingSenderId: "193388237446",
            appId: "1:193388237446:web:bf43acd550157d04bb7707",
            measurementId: "G-R31S7D36X9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Шапка -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    📁 Медиа Хаб с Транскрибацией
                </h1>
                <p class="text-slate-400 text-sm mt-1">Всё мгновенно синхронизируется у всех по вашей ссылке 24/7!</p>
            </div>
            <div id="connection-status" class="px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                Подключение к базе...
            </div>
        </header>

        <!-- Управление папками -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4 shadow-lg">
            <div class="flex items-center gap-2 flex-wrap" id="folders-filter">
                <button onclick="filterFolder('all')" class="folder-btn px-4 py-2 rounded-xl text-xs font-medium bg-indigo-600 text-white transition">
                    📂 Все файлы
                </button>
                <!-- Динамические папки -->
            </div>
            <div class="flex gap-2">
                <input type="text" id="new-folder-name" placeholder="Имя новой папки..." 
                    class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition">
                <button onclick="createNewFolder()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-medium transition">
                    + Создать папку
                </button>
            </div>
        </div>

        <!-- Форма добавления -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-10 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-white">Добавить видео или фото</h2>
            <form id="media-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Название файла</label>
                        <input type="text" id="file-title" required placeholder="Например: Выпуск 1" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Тип медиа</label>
                        <select id="file-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            <option value="video">Видео (любой размер, формат 9:16, 16:9 и др.)</option>
                            <option value="image">Фото / Картинка</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Папка</label>
                        <select id="file-folder" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            <option value="Общие">Общие</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Ссылка на файл (Google Диск или прямая URL-ссылка)</label>
                    <input type="url" id="file-url" required placeholder="https://drive.google.com/file/d/ВАШ_ID/view" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Транскрибация / Текст</label>
                    <textarea id="file-transcription" rows="3" placeholder="Введите или вставьте сюда транскрибацию..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-indigo-600/25">
                    Опубликовать на сайт
                </button>
            </form>
        </div>

        <!-- Список элементов -->
        <div class="mb-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-white">Загруженные файлы</h2>
            <span id="files-count" class="text-xs text-slate-400">Загрузка...</span>
        </div>

        <div id="media-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="text-center py-12 text-slate-500 col-span-full">
                Подключение к облаку...
            </div>
        </div>
    </div>

    <script>
        let currentFolderFilter = 'all';
        let cachedItems = [];
        let foldersList = ['Общие'];

        window.addEventListener('firebase-ready', () => {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = 'База подключена (Online)';
            statusEl.className = 'px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-400 border border-emerald-500/30';
            
            loadMediaItems();
            loadFolders();
        });

        function formatMediaUrl(url, type) {
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    const fileId = match[1];
                    if (type === 'video') {
                        return `https://docs.google.com/uc?export=download&id=${fileId}`;
                    } else {
                        return `https://lh3.googleusercontent.com/d/${fileId}`;
                    }
                }
            }
            return url;
        }

        function loadFolders() {
            window.onSnapshot(window.collection(window.db, "folders"), (snapshot) => {
                foldersList = ['Общие'];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.name && !foldersList.includes(data.name)) {
                        foldersList.push(data.name);
                    }
                });
                renderFoldersUI();
            });
        }

        function renderFoldersUI() {
            const filterContainer = document.getElementById('folders-filter');
            const selectContainer = document.getElementById('file-folder');
            
            // Сохраняем текущий выбор в селекте формы
            const selectedVal = selectContainer.value;
            selectContainer.innerHTML = '';
            
            let filterHtml = `<button onclick="filterFolder('all')" class="folder-btn px-4 py-2 rounded-xl text-xs font-medium ${currentFolderFilter === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'} transition">📂 Все файлы</button>`;
            
            foldersList.forEach(folder => {
                const isSelected = currentFolderFilter === folder;
                filterHtml += `<button onclick="filterFolder('${folder}')" class="folder-btn px-4 py-2 rounded-xl text-xs font-medium ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'} transition">📁 ${folder}</button>`;
                
                const opt = document.createElement('option');
                opt.value = folder;
                opt.textContent = folder;
                selectContainer.appendChild(opt);
            });
            
            filterContainer.innerHTML = filterHtml;
            if (foldersList.includes(selectedVal)) {
                selectContainer.value = selectedVal;
            }
        }

        window.createNewFolder = async function() {
            const nameInput = document.getElementById('new-folder-name');
            const name = nameInput.value.trim();
            if (!name) return;
            
            if (foldersList.includes(name)) {
                alert("Такая папка уже существует!");
                return;
            }

            try {
                await window.addDoc(window.collection(window.db, "folders"), { name });
                nameInput.value = '';
                alert("Папка создана!");
            } catch (err) {
                alert("Ошибка создания папки: " + err.message);
            }
        };

        window.filterFolder = function(folderName) {
            currentFolderFilter = folderName;
            renderFoldersUI();
            renderMediaGrid();
        };

        function loadMediaItems() {
            const q = window.query(window.collection(window.db, "mediaItems"), window.orderBy("createdAt", "desc"));
            
            window.onSnapshot(q, (snapshot) => {
                cachedItems = [];
                snapshot.forEach((docSnap) => {
                    cachedItems.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderMediaGrid();
            });
        }

        function renderMediaGrid() {
            const grid = document.getElementById('media-grid');
            const countEl = document.getElementById('files-count');
            grid.innerHTML = '';

            const filtered = cachedItems.filter(item => {
                if (currentFolderFilter === 'all') return true;
                return (item.folder || 'Общие') === currentFolderFilter;
            });
            
            countEl.textContent = `Файлов в предпросмотре: ${filtered.length}`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="text-center py-16 text-slate-500 col-span-full bg-slate-900/50 rounded-2xl border border-slate-800">
                        <p class="text-base font-medium">В этой папке пока нет файлов.</p>
                        <p class="text-sm mt-1">Добавьте новый файл или переключите папку!</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((data) => {
                const id = data.id;
                const directUrl = formatMediaUrl(data.url, data.type);
                const fileFolder = data.folder || 'Общие';
                const fileType = data.type || 'video';

                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between";
                
                let mediaContent = '';
                if (fileType === 'video') {
                    mediaContent = `
                        <div class="w-full bg-black aspect-video flex items-center justify-center relative overflow-hidden">
                            <video controls preload="metadata" class="w-full h-full object-contain">
                                <source src="${directUrl}">
                                Ваш браузер не поддерживает видео.
                            </video>
                        </div>
                    `;
                } else {
                    mediaContent = `
                        <div class="w-full bg-black aspect-video flex items-center justify-center relative overflow-hidden">
                            <img src="${directUrl}" alt="${data.title}" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop';">
                        </div>
                    `;
                }

                let folderOptions = '';
                foldersList.forEach(f => {
                    folderOptions += `<option value="${f}" ${f === fileFolder ? 'selected' : ''}>${f}</option>`;
                });

                card.innerHTML = `
                    <div>
                        ${mediaContent}
                        <div class="p-5">
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <input type="text" value="${escapeHtml(data.title || '')}" id="title-${id}" 
                                    class="bg-transparent font-semibold text-white text-base w-full border-b border-transparent hover:border-slate-700 focus:border-indigo-500 focus:outline-none transition py-0.5">
                                <button onclick="saveTitle('${id}')" title="Сохранить название" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg shrink-0 transition">
                                    💾
                                </button>
                            </div>

                            <!-- Блок редактирования папки и типа файла -->
                            <div class="grid grid-cols-2 gap-2 mb-3">
                                <div>
                                    <label class="text-[10px] text-slate-400 block mb-0.5">Папка:</label>
                                    <select id="folder-select-${id}" onchange="updateFileMeta('${id}')" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-indigo-300 focus:outline-none">
                                        ${folderOptions}
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-400 block mb-0.5">Тип:</label>
                                    <select id="type-select-${id}" onchange="updateFileMeta('${id}')" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-indigo-300 focus:outline-none">
                                        <option value="video" ${fileType === 'video' ? 'selected' : ''}>Видео</option>
                                        <option value="image" ${fileType === 'image' ? 'selected' : ''}>Фото</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Блок редактирования URL -->
                            <div class="mb-3">
                                <label class="text-[10px] text-slate-400 block mb-0.5">Ссылка на файл:</label>
                                <div class="flex gap-1">
                                    <input type="url" value="${escapeHtml(data.url || '')}" id="url-${id}" 
                                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
                                    <button onclick="saveFileUrl('${id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded-lg text-xs shrink-0 transition">Изменить</button>
                                </div>
                            </div>
                            
                            <div class="mt-2">
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-xs font-medium text-slate-400">Транскрибация:</label>
                                    <div class="flex gap-2">
                                        <button onclick="copyTranscription('${id}')" class="text-xs text-indigo-400 hover:text-indigo-300 transition">Копировать</button>
                                        <button onclick="saveTranscription('${id}')" class="text-xs bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 px-2 py-0.5 rounded transition">Сохранить текст</button>
                                    </div>
                                </div>
                                <textarea id="trans-${id}" rows="4" 
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">${escapeHtml(data.transcription || '')}</textarea>
                            </div>
                        </div>
                    </div>
                    <div class="px-5 py-3 bg-slate-950/50 border-t border-slate-800 flex justify-between items-center text-xs text-slate-500">
                        <span>Добавлено: ${new Date(data.createdAt?.toDate?.() || Date.now()).toLocaleDateString()}</span>
                        <button onclick="deleteItem('${id}')" class="text-red-400 hover:text-red-300 transition">Удалить</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('media-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('file-title').value;
            const type = document.getElementById('file-type').value;
            const folder = document.getElementById('file-folder').value;
            const url = document.getElementById('file-url').value;
            const transcription = document.getElementById('file-transcription').value;

            try {
                await window.addDoc(window.collection(window.db, "mediaItems"), {
                    title,
                    type,
                    folder,
                    url,
                    transcription,
                    createdAt: new Date()
                });
                document.getElementById('media-form').reset();
            } catch (err) {
                alert("Ошибка сохранения: " + err.message);
            }
        });

        window.changeItemFolder = async function(id) {
            const newFolder = document.getElementById(`folder-select-${id}`).value;
            try {
                await window.updateDoc(window.doc(window.db, "mediaItems", id), {
                    folder: newFolder
                });
            } catch (err) {
                alert("Ошибка изменения папки: " + err.message);
            }
        };

        window.updateFileMeta = async function(id) {
            const newFolder = document.getElementById(`folder-select-${id}`).value;
            const newType = document.getElementById(`type-select-${id}`).value;
            try {
                await window.updateDoc(window.doc(window.db, "mediaItems", id), {
                    folder: newFolder,
                    type: newType
                });
            } catch (err) {
                alert("Ошибка обновления параметров: " + err.message);
            }
        };

        window.saveFileUrl = async function(id) {
            const newUrl = document.getElementById(`url-${id}`).value.trim();
            if (!newUrl) return;
            try {
                await window.updateDoc(window.doc(window.db, "mediaItems", id), {
                    url: newUrl
                });
                alert("Ссылка на файл успешно обновлена!");
            } catch (err) {
                alert("Ошибка обновления ссылки: " + err.message);
            }
        };

        window.saveTranscription = async function(id) {
            const text = document.getElementById(`trans-${id}`).value;
            try {
                await window.updateDoc(window.doc(window.db, "mediaItems", id), {
                    transcription: text
                });
                alert("Транскрибация сохранена!");
            } catch (err) {
                alert("Ошибка: " + err.message);
            }
        };

        window.saveTitle = async function(id) {
            const title = document.getElementById(`title-${id}`).value;
            try {
                await window.updateDoc(window.doc(window.db, "mediaItems", id), {
                    title: title
                });
                alert("Название сохранено!");
            } catch (err) {
                alert("Ошибка: " + err.message);
            }
        };

        window.copyTranscription = function(id) {
            const textarea = document.getElementById(`trans-${id}`);
            textarea.select();
            document.execCommand('copy');
            alert("Транскрибация скопирована!");
        };

        window.deleteItem = async function(id) {
            if (confirm("Удалить эту запись?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "mediaItems", id));
                } catch (err) {
                    alert("Ошибка: " + err.message);
                }
            }
        };

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
